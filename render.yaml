# Render Blueprint: New + > Blueprint, pick your GitHub repo.
databases:
  - name: cinebook-db
    databaseName: cinebook
    user: cinebook
    plan: free

services:
  - type: web
    name: cinebook-tn
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cinebook-db
          property: connectionString
      # Admin login for /admin/ (Render will ask you for these on first deploy)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
